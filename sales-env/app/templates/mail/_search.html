<form method="get" action="/mail" class="flex items-center gap-2 px-4 py-3 border-b border-gray-200" role="search">
  <input type="hidden" name="label" value="{{ label or 'INBOX' }}">
  <input type="search" name="q" value="{{ q|default('') }}" placeholder="Search mail" aria-label="Search mail"
         class="flex-1 max-w-2xl bg-gray-100 focus:bg-white border border-transparent focus:border-gray-300 rounded-full px-5 py-2 text-sm outline-none">
  <button type="submit" class="px-4 py-2 text-sm rounded-full border border-gray-300 hover:bg-gray-100">Search</button>
  {% if q %}<a href="/mail?label={{ label|urlencode }}" class="text-sm text-gray-600 underline">Clear search</a>{% endif %}
</form>
