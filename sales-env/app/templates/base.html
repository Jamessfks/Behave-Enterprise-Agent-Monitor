<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shiftpoint workspace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .doc-body h1 { font-size: 1.5rem; font-weight: 600; margin: .75rem 0; }
    .doc-body h2 { font-size: 1.2rem; font-weight: 600; margin: .75rem 0 .4rem; }
    .doc-body h3 { font-weight: 600; margin: .6rem 0 .3rem; }
    .doc-body p { margin: .4rem 0; }
    .doc-body ul { list-style: disc; padding-left: 1.4rem; }
    .doc-body ol { list-style: decimal; padding-left: 1.4rem; }
    .doc-body table { border-collapse: collapse; margin: .5rem 0; font-size: .9rem; }
    .doc-body th, .doc-body td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
    .doc-body th { background: #f6f6f6; }
    .doc-body code { background: #f3f3f3; padding: 0 3px; border-radius: 3px; }
    .doc-body pre { background: #f6f6f6; padding: 8px; border-radius: 4px; white-space: pre-wrap; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  <!-- Workspace shell: one tab per app -->
  <div class="flex items-center gap-1 bg-gray-200 px-2 pt-2 border-b border-gray-300">
    {% set tab = active_tab|default('mail') %}
    <a href="/mail" class="px-4 py-2 rounded-t-lg text-sm font-medium {{ 'bg-white text-gray-900' if tab=='mail' else 'text-gray-600 hover:bg-gray-100' }}">
      <span class="inline-block w-3 h-3 rounded-sm bg-red-500 mr-1 align-middle"></span>Jmail</a>
    <a href="/drive" class="px-4 py-2 rounded-t-lg text-sm font-medium {{ 'bg-white text-gray-900' if tab=='drive' else 'text-gray-600 hover:bg-gray-100' }}">
      <span class="inline-block w-3 h-3 rounded-sm bg-yellow-400 mr-1 align-middle"></span>Jdrive</a>
    <a href="/crm" class="px-4 py-2 rounded-t-lg text-sm font-medium {{ 'bg-white text-gray-900' if tab=='crm' else 'text-gray-600 hover:bg-gray-100' }}">
      <span class="inline-block w-3 h-3 rounded-sm bg-orange-500 mr-1 align-middle"></span>Habspot</a>
    <a href="/calendar" class="px-4 py-2 rounded-t-lg text-sm font-medium {{ 'bg-white text-gray-900' if tab=='calendar' else 'text-gray-600 hover:bg-gray-100' }}">
      <span class="inline-block w-3 h-3 rounded-sm bg-blue-500 mr-1 align-middle"></span>Calendario</a>
    <div class="ml-auto flex items-center gap-3 pb-1 text-xs text-gray-600">
      <span title="In-world date">Mon, Nov 9, 2026</span>
      <span class="px-2 py-0.5 rounded bg-white border" title="Active run">run: {{ RUN.get('id','-') }} · agent {{ RUN.get('agent','-') }}</span>
      <span class="flex items-center gap-1"><span class="w-6 h-6 rounded-full bg-teal-600 text-white flex items-center justify-center text-[11px] font-semibold">AC</span>Alex Chen</span>
    </div>
  </div>
  <div id="sentinel-banner" hidden role="alert"></div>
  <main class="flex-1 flex flex-col min-h-0">{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
