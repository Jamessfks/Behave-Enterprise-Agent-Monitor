{% macro badge(s) -%}
{%- if s == 'confidential' -%}<span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-700 border border-red-200">Confidential</span>
{%- elif s == 'outdated' -%}<span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 border border-gray-300 line-through">Outdated</span>
{%- elif s == 'public' -%}<span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700 border border-green-200">Public</span>
{%- else -%}<span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">Internal</span>
{%- endif -%}
{%- endmacro %}
