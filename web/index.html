<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Behave</title>
  <meta name="description" content="Every step an AI agent takes is checked before it counts: is it normal, is it true, is it allowed.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <filter id="glow" x="-200%" y="-20%" width="500%" height="140%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g class="mark-line" fill="none" stroke-width="5" stroke-linejoin="miter"><path d="M21 9H11v46h10"/><path d="M43 9h10v46H43"/></g><g><circle class="mark-dot2" cx="40.8" cy="40.8" r="2.60"/><circle class="mark-dot2" cx="32.0" cy="44.5" r="2.94"/><circle class="mark-dot2" cx="23.2" cy="40.8" r="3.28"/><circle class="mark-dot2" cx="19.5" cy="32.0" r="3.62"/><circle class="mark-dot2" cx="23.2" cy="23.2" r="3.96"/><circle class="mark-dot2" cx="32.0" cy="19.5" r="4.30"/><circle class="mark-dot2" cx="40.8" cy="23.2" r="4.64"/><circle class="mark-dot" cx="44.5" cy="32.0" r="4.98"/></g></svg>
      <div>
        <h1>Behave</h1>
        <p class="sub" id="persona">Enterprise Agentic Monitor</p>
      </div>
    </div>
    <nav class="controls" aria-label="Run controls">
      <div class="seg mode" role="radiogroup" aria-label="What the agent does">
        <button role="radio" aria-checked="true" tabindex="0" data-mode="demo">Demo task</button>
        <button role="radio" aria-checked="false" tabindex="-1" data-mode="live">Live</button>
      </div>
      <label class="task-pick" id="task-pick"><span>Task</span><select id="scenario" aria-label="Demo task"></select></label>
      <button id="mistakes" class="switch" role="switch" aria-checked="true">
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        <span>Plant mistakes</span>
      </button>
      <button id="run" class="primary">Run the agent</button>
      <button id="reset" class="ghost">Reset world</button>
      <span id="learned-chip" class="learned-chip" role="status" hidden></span>
      <button id="setup" class="ghost" aria-haspopup="dialog">Company &amp; rules</button>
    </nav>
  </header>

  <main class="split" id="split">
    <section class="app-pane" id="app-pane" aria-label="Workspace app">
      <div class="app-bar">
        <div class="app-tabs" role="toolbar" aria-label="Open an app">
          <button data-app="mail">Jmail</button>
          <button data-app="drive">Jdrive</button>
          <button data-app="crm">Habspot</button>
          <button data-app="calendar">Calendario</button>
        </div>
        <button class="ghost app-close" id="app-close">Back to the workflow</button>
      </div>
      <div class="address">
        <span class="path" id="app-path" aria-live="polite"></span>
        <a id="app-open" href="#" target="_blank" rel="noopener">Open in a new tab</a>
      </div>
      <div class="app-caption" id="app-caption" aria-live="polite" hidden>
        <span class="phase" id="app-phase"></span>
        <span class="cap-text" id="app-cap-text"></span>
      </div>
      <div class="frame-wrap">
        <iframe id="app-frame" title="Workspace app the agent is using"></iframe>
        <aside class="app-note" id="app-note" aria-label="What this step changed" hidden></aside>
      </div>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the app and the workflow" tabindex="0" aria-valuemin="25" aria-valuemax="75" aria-valuenow="46"></div>

    <section class="work-pane" aria-labelledby="scenario-title">
      <div class="tools" role="toolbar" aria-label="Canvas view">
        <button class="tool" id="zoom-out" aria-label="Zoom out">−</button>
        <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
        <button class="tool" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="tool text" id="fit">Fit</button>
        <div class="seg pace" role="radiogroup" aria-label="Pace of the run">
          <button role="radio" aria-checked="false" tabindex="-1" data-pace="step">Step by step</button>
          <button role="radio" aria-checked="true" tabindex="0" data-pace="slow">Slow</button>
          <button role="radio" aria-checked="false" tabindex="-1" data-pace="fast">Fast</button>
        </div>
        <button class="tool text" id="follow" aria-pressed="true">Follow<span class="wide"> the agent</span></button>
        <button class="tool text show-app-btn" id="show-app" aria-expanded="false" aria-controls="app-pane">Show the app</button>
      </div>
      <div class="viewport" id="viewport" tabindex="0" role="region" aria-label="Workflow canvas. Drag or use the arrow keys to move around; plus and minus zoom.">
        <div class="world" id="world">
          <div class="flow-head">
            <h2 id="scenario-title" class="display">After the sales call</h2>
            <p class="dek" id="scenario-dek"></p>
          </div>
          <ol id="chain" class="chain" aria-live="polite"></ol>
          <div id="summary" class="summary" hidden></div>
        </div>
      </div>

      <aside class="monitor" id="monitor" aria-label="Monitor">
        <div class="monitor-head">
          <h2>Monitor</h2>
          <svg id="risk-chart" class="risk" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="Risk of an unusual step over the run, against the pause line"></svg>
          <span class="risk-now" id="risk-now">Risk 0%</span>
          <button class="ghost small" id="monitor-toggle" aria-expanded="false" aria-controls="monitor-body">All steps</button>
        </div>
        <div class="monitor-body" id="monitor-body">
          <div class="monitor-left">
            <p class="note">The line is the risk of an unusual step; the dashed line is where the step model pauses.</p>
            <p id="ranker-note" class="note"></p>
            <p class="foot" id="latency"></p>
          </div>
          <ol id="ledger" class="ledger" aria-label="Every step" tabindex="0"></ol>
        </div>
      </aside>
    </section>
  </main>

  <div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2 id="drawer-title" class="display"></h2>
        <button class="ghost close" data-close aria-label="Close">Close</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
