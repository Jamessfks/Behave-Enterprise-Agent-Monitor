[project]
name = "sentinel"
version = "0.1.0"
description = "Behavioral oversight layer for computer-use agents"
requires-python = ">=3.11"
dependencies = [
    "behaviorgpt>=0.10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "anthropic>=0.70",
    "python-multipart>=0.0.33",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "upstash-redis>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Live mode with computer use (README: Live). Local only; drives the installed Edge.
live = ["google-genai>=2.7.0", "playwright>=1.50"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# World data generators: dict(...) rows read better than literals for long records.
"scripts/world/gen_*.py" = ["C408"]
